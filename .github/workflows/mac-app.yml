name: PR App Builds

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-app-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-mac-app:
    name: Build macOS app
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify Xcode 27 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -q 'Xcode 27' || {
            echo 'Expected Xcode 27 toolchain.' >&2
            exit 1
          }

      - name: Install XcodeGen
        run: |
          if brew tap | grep -Fxq 'aws/tap'; then
            brew untap aws/tap
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install --formula xcodegen
          fi

      - name: Show toolchain
        run: |
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS app
        run: |
          xcodebuild \
            -project PRC-PhotoBooth.xcodeproj \
            -scheme PRC-PhotoBooth-Mac \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/PRC-PhotoBooth-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run Mac tests
        run: |
          xcodebuild \
            -project PRC-PhotoBooth.xcodeproj \
            -scheme PRC-PhotoBoothTests \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/PRC-PhotoBooth-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build macOS app (Release)
        run: |
          xcodebuild \
            -project PRC-PhotoBooth.xcodeproj \
            -scheme PRC-PhotoBooth-Mac \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/PRC-PhotoBooth-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        id: package
        run: |
          app_path="$RUNNER_TEMP/PRC-PhotoBooth-DerivedData/Build/Products/Debug/PRC-PhotoBooth-Mac.app"
          archive_path="$RUNNER_TEMP/PRC-PhotoBooth-Mac-${GITHUB_SHA:0:7}.zip"

          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: PRC-PhotoBooth-Mac-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Add artifact link to job summary
        run: |
          {
            echo "## Release artifacts"
            echo
            echo "Unsigned Debug build packaged as \`PRC-PhotoBooth-Mac-${GITHUB_SHA:0:7}.zip\`."
            echo "Download it from [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"

  build-ipad-app:
    name: Build iPad Simulator app
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify Xcode 27 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -q 'Xcode 27' || {
            echo 'Expected Xcode 27 toolchain.' >&2
            exit 1
          }

      - name: Install XcodeGen
        run: |
          if brew tap | grep -Fxq 'aws/tap'; then
            brew untap aws/tap
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install --formula xcodegen
          fi

      - name: Show toolchain
        run: |
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPad Simulator app
        run: |
          xcodebuild \
            -project PRC-PhotoBooth.xcodeproj \
            -scheme PRC-PhotoBooth-iPad \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/PRC-PhotoBooth-iPad-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build iPad Simulator app (Release)
        run: |
          xcodebuild \
            -project PRC-PhotoBooth.xcodeproj \
            -scheme PRC-PhotoBooth-iPad \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/PRC-PhotoBooth-iPad-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run iPad tests
        run: |
          set -euo pipefail
          ipad_udid="$(xcrun simctl list devices available | sed -nE '/iPad/ s/.*\(([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})\).*/\1/p' | head -n 1)"
          test -n "$ipad_udid" || {
            echo 'No available iPad simulator found.' >&2
            exit 1
          }
          echo "Testing on discovered iPad simulator: $ipad_udid"
          xcodebuild \
            -project PRC-PhotoBooth.xcodeproj \
            -scheme PRC-PhotoBooth-iPadTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$ipad_udid" \
            -derivedDataPath "$RUNNER_TEMP/PRC-PhotoBooth-iPad-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Package app
        id: package
        run: |
          app_path="$RUNNER_TEMP/PRC-PhotoBooth-iPad-DerivedData/Build/Products/Debug-iphonesimulator/PRC-PhotoBooth-iPad.app"
          archive_path="$RUNNER_TEMP/PRC-PhotoBooth-iPad-Simulator-${GITHUB_SHA:0:7}.zip"

          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload iPad app artifact
        uses: actions/upload-artifact@v7
        with:
          name: PRC-PhotoBooth-iPad-Simulator-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Add artifact link to job summary
        run: |
          {
            echo "## Release artifacts"
            echo
            echo "Unsigned Debug Simulator build packaged as \`PRC-PhotoBooth-iPad-Simulator-${GITHUB_SHA:0:7}.zip\`."
            echo "Download it from [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"
